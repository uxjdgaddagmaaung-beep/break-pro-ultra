name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace --console=plain > build.log 2>&1
          code=$?
          {
            echo '### Gradle errors'
            echo '```'
            grep -E '^e: ' build.log | sed 's#file:///home/runner/work/break-pro-ultra/break-pro-ultra/##' | head -80
            grep -A8 'What went wrong' build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: ' build.log | head -50 | while read -r l; do echo "::error::${l}"; done
          tail -30 build.log
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
