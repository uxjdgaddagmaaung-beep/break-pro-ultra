name: Build from zip

on:
  workflow_dispatch:
  push:
    paths:
      - 'break-pro-ultra.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q break-pro-ultra.zip -d unzipped
          ls unzipped/break-pro-ultra

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: unzipped/break-pro-ultra
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: unzipped/break-pro-ultra/app/build/outputs/apk/debug/app-debug.apk
